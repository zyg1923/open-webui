<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>澜沧江 AI 控制台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #101215;
      color: #e8eaed;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 420px;
      background: #1a1d23;
      border: 1px solid #2c313a;
      border-radius: 16px;
      padding: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; color: #9aa3af; font-size: 14px; line-height: 1.6; }
    .ok { color: #7ddea0; font-size: 13px; margin-bottom: 18px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .primary { background: #4f8cff; color: #fff; }
    .danger { background: #3a2226; color: #ffb4b4; }
    .hint { font-size: 12px; color: #7b8494; }
  </style>
</head>
<body>
  <div class="card">
    <h1>澜沧江 AI</h1>
    <p>后台已在运行。关掉这个页面或对话页，都不会退出程序。只有点「退出后台」或托盘退出才会停止。</p>
    <div class="ok" id="st">后台运行中</div>
    <button class="primary" onclick="goChat()">打开对话</button>
    <button class="danger" onclick="quit()">退出后台</button>
    <p class="hint">托盘图标也可打开对话或退出。</p>
  </div>
  <script>
    function goChat() { fetch("/open-chat").catch(function () {}); }
    function quit() {
      if (confirm("确定退出后台？对话服务会停止。")) {
        fetch("/quit").catch(function () {});
        document.getElementById("st").textContent = "正在退出…";
      }
    }
  </script>
</body>
</html>
